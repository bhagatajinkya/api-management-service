spring.application.name=api-management-service
server.port=8081

# Application Information
info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gatekeeper_db
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Debug Logs
logging.level.org.flywaydb=DEBUG


security.jwt.expiration-seconds=3600
security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production